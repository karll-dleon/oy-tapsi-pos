<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OY, TAPSI! ATBP. — Inventory CRUD Dashboard</title>
  <style>
    :root {
      --crimson: #640017;
      --olive: #5a5e27;
      --espresso: #2f1b1a;
      --cream: #efefc9;
      --card: #f7f7dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--espresso);
      padding: 24px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header {
      background: var(--crimson);
      color: var(--cream);
      padding: 18px 22px;
      border-radius: 12px;
      border: 2px solid var(--espresso);
      margin-bottom: 20px;
    }
    .panel {
      background: var(--card);
      border: 2px solid var(--espresso);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    input, select, button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--espresso);
      font-size: 0.92rem;
    }
    button {
      background: var(--crimson);
      color: var(--cream);
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: var(--olive); }
    button.secondary { background: var(--olive); }
    button.danger { background: #8b1e24; padding: 6px 10px; font-size: 0.82rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      background: #fff;
    }
    th, td {
      border: 1px solid var(--espresso);
      padding: 10px;
      text-align: left;
      font-size: 0.9rem;
    }
    th { background: var(--crimson); color: var(--cream); }
    #status-msg { margin-top: 10px; font-weight: bold; color: var(--olive); min-height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>OY, TAPSI! ATBP. — Inventory Management</h1>
      <p>Node.js + Express REST CRUD Web Application (Activity 1.3)</p>
    </header>

    <section class="panel">
      <h2>Add / Update Menu Stock</h2>
      <form id="item-form" class="grid-form">
        <input type="text" id="sku" placeholder="SKU (e.g., SILOG-002)" required />
        <input type="text" id="name" placeholder="Item Name (e.g., PORKSILOG)" required />
        <input type="text" id="category" placeholder="Category (e.g., SILOG MEALS)" required />
        <input type="number" id="price" placeholder="Price (PHP)" min="0" step="0.01" required />
        <input type="number" id="stock" placeholder="Stock Qty" min="0" step="1" required />
        <button type="submit">+ Add Item</button>
      </form>
      <div id="status-msg"></div>
    </section>

    <section class="panel">
      <h2>Current Inventory Records</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>SKU</th>
            <th>Item Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="items-tbody"></tbody>
      </table>
    </section>
  </div>

  <script>
    const tbody = document.getElementById("items-tbody");
    const form = document.getElementById("item-form");
    const statusMsg = document.getElementById("status-msg");

    async function loadItems() {
      const res = await fetch("/api/items");
      const json = await res.json();
      tbody.innerHTML = "";
      (json.data || []).forEach((item) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${item.sku}</td>
          <td>${item.name}</td>
          <td>${item.category}</td>
          <td>₱${Number(item.price).toFixed(2)}</td>
          <td>${item.stock}</td>
          <td>${item.available ? "Available" : "Out of Stock"}</td>
          <td>
            <button class="secondary" style="padding:6px 10px;font-size:0.82rem;" onclick="restockItem(${item.id}, ${item.stock + 5})">+5 Stock</button>
            <button class="danger" onclick="removeItem(${item.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        sku: document.getElementById("sku").value,
        name: document.getElementById("name").value,
        category: document.getElementById("category").value,
        price: Number(document.getElementById("price").value),
        stock: Number(document.getElementById("stock").value)
      };

      const res = await fetch("/api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!res.ok) {
        statusMsg.textContent = json.error + (json.details ? ": " + json.details.join(" ") : "");
        return;
      }
      statusMsg.textContent = json.message;
      form.reset();
      loadItems();
    });

    async function restockItem(id, nextStock) {
      const res = await fetch(`/api/items/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stock: nextStock, available: nextStock > 0 })
      });
      const json = await res.json();
      statusMsg.textContent = json.message || json.error;
      loadItems();
    }

    async function removeItem(id) {
      const res = await fetch(`/api/items/${id}`, { method: "DELETE" });
      const json = await res.json();
      statusMsg.textContent = json.message || json.error;
      loadItems();
    }

    loadItems();
  </script>
</body>
</html>
